<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream Invites | Elegant Wedding Invitations &amp; Cards</title>
    <meta name="description" content="Discover elegant wedding invitations and beautifully designed wedding cards by Dream Invites. Explore our collection and inquire on WhatsApp." />
    <meta property="og:title" content="Dream Invites | Elegant Wedding Invitations &amp; Cards" />
    <meta property="og:description" content="Discover elegant wedding invitations and beautifully designed wedding cards by Dream Invites. Explore our collection and inquire on WhatsApp." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FAF8F5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dream-invites-theme') || localStorage.getItem('dream_invites_theme');
          var theme = saved;
          if (!theme || (theme !== 'light' && theme !== 'dark')) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-stone-900 antialiased selection:bg-[#00AEEF]/20 selection:text-stone-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
